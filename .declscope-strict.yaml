# The settings declscope holds itself to, applied via an explicit -config so
# that they do not reach the analysistest packages under testdata: the config
# lookup walks up from each analyzed package, and a default-named file at the
# repository root would silently change what those tests assert.
rules:
  naming:
    # always | never | ondemand. The built-in default is never; declscope keeps
    # the convention for itself at ondemand. Not `always`: under it every
    # unexported helper in a single-namespace package (internal/config,
    # internal/baseline, ...) would need a prefix that distinguishes nothing
    # there.
    qualify: ondemand
    # true | false. The naming rule reaches exported declarations too. Inside
    # this module an exported name is read as bare as any other, so the
    # namespace is wanted in the name at exactly the same call sites.
    exported: true
  # off | loose | strict. The built-in default is loose. declscope holds itself
  # to strict: each declaration a directive widens, not only the directive as a
  # whole, is asked whether anything outside its namespace needs it.
  surplus: strict
  # off | loose | strict. The built-in default is loose. declscope holds
  # itself to strict: a scope directive that names the scope its declarations
  # would have without it, under this configuration, is reported and deleted,
  # so every directive left in the tree changes something today.
  unused: strict
