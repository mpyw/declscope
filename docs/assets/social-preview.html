<html><head><meta charset="utf-8">

<style>
html,body{margin:0;width:1280px;height:640px;background:#0D1117;overflow:hidden}

<svg viewBox="0 0 16 16" shape-rendering="crispEdges">
  <path fill="#E6E8EB" d="M0 0H9V5H5V9H0Z"/>
  <rect fill="#E6E8EB" x="0" y="10" width="9" height="6"/>
  <rect fill="#E6E8EB" x="10" y="0" width="6" height="16"/>
  <rect fill="#00ADD8" x="6" y="6" width="3" height="3"/>
</svg>
<div>
<h1>declscope</h1>
<p><b>A visibility level below unexported.</b><br>Keep Go packages flat without<br>losing their boundaries.</p>
<code><span>//</span>declscope:private</code>
</div></div></body></html>
