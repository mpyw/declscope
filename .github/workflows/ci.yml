name: CI

on:
  push: {}
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Every tool is pinned in mise.toml, so CI and a contributor's machine run
      # the same binaries. test_all.sh checks that mise.toml's go still matches
      # go.mod's toolchain, which golangci-lint is strict about.
      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./... ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          flags: unittests
          name: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m ./...

  spec:
    name: Spec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The formal specs are documentation that cannot drift only if something
      # re-runs them. fslc is the FSL verifier: https://github.com/ymm-oss/fsl
      - name: Install fslc
        run: |
          curl -fsSL https://raw.githubusercontent.com/ymm-oss/fsl/main/install.sh | bash -s -- --no-skill
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Most specs must be proved; two must stay violated, since they hold the
      # counterexamples for designs that are unsound. verify.sh holds the
      # lists, and fails when a spec is in neither, so the count does not need
      # restating here every time one is added.
      - name: Verify the specs
        run: ./spec/verify.sh

  dogfood:
    name: Dogfood
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v2
        with:
          cache: true

      # declscope is subject to its own rules, at the strictest setting.
      # Silence is the assertion: every namespace crossing inside the tool is
      # stated in the source, so anything printed here is one nobody wrote down.
      - name: Run declscope on itself
        run: go run ./cmd/declscope -config .declscope-strict.yaml ./...

      # Regenerating the baseline on a clean tree must produce no baseline at
      # all: declscope has no recorded violations of its own.
      - name: Check the baseline stays empty
        run: |
          go run ./cmd/declscope baseline -config .declscope-strict.yaml -o /tmp/baseline.yaml ./...
          if grep -qE '^\s{4}' /tmp/baseline.yaml; then
            echo "declscope now has recorded violations of its own:"
            cat /tmp/baseline.yaml
            exit 1
          fi
