name: CI

on:
  push: {}
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Track the go directive in go.mod. setup-go sets GOTOOLCHAIN=local,
          # so a hardcoded version fails outright once a dependency bump raises
          # the directive above it, instead of picking up a newer toolchain.
          go-version-file: go.mod

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./... ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          flags: unittests
          name: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint refuses to load a module whose go directive is newer
          # than the Go it was built with, so this pin has to move whenever the
          # directive in go.mod does. v2.13.0+ is built with Go 1.27.
          version: v2.13.1
          args: --timeout=5m

  dogfood:
    name: Dogfood
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # declscope is subject to its own rules, at the strictest setting.
      # internal/{analyzer,collect,options,report}.go form one unit and say so
      # with a shared namespace.
      - name: Run declscope on itself
        run: go run ./cmd/declscope -config .declscope-strict.yaml ./...

      # Regenerating the baseline on a clean tree must produce no baseline at
      # all: declscope has no recorded violations of its own.
      - name: Check the baseline stays empty
        run: |
          go run ./cmd/declscope baseline -config .declscope-strict.yaml -o /tmp/baseline.yaml ./...
          if grep -qE '^\s{4}' /tmp/baseline.yaml; then
            echo "declscope now has recorded violations of its own:"
            cat /tmp/baseline.yaml
            exit 1
          fi
