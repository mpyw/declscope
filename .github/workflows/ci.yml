name: CI

on:
  push: {}
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    # id-token: write is what lets the Codecov upload authenticate as this
    # workflow run instead of with a stored token. Nothing else in the job
    # needs it, and the workflow-wide contents: read has to be restated
    # alongside it, since a job's permissions replace the default rather than
    # add to it.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Every tool is pinned in mise.toml, so CI and a contributor's machine run
      # the same binaries. test_all.sh checks that mise.toml's go still matches
      # go.mod's toolchain, which golangci-lint is strict about.
      - uses: jdx/mise-action@v4
        with:
          cache: true

      # The subcommand tests drive the built linter as a subprocess, so `go test`
      # counts none of the statements they run. coverage.sh builds that binary
      # with -cover, merges its counters with go test's profile into
      # coverage-merged.txt, and prints the total. See cmd/declscope/cover_test.go.
      - name: Run tests with coverage
        run: ./coverage.sh
        env:
          GOTESTFLAGS: -v -race

      # OIDC rather than a CODECOV_TOKEN secret: the repository is public, so
      # there is nothing a token would protect that the run's own identity does
      # not, and one less secret to rotate. A pull request from a fork reaches
      # neither, and uploads without either one.
      #
      # continue-on-error: Codecov being unreachable is not a reason to fail a
      # pull request. The other jobs are what say whether the code is good.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage-merged.txt
          flags: unittests
          name: codecov
          use_oidc: true
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m ./...

  spec:
    name: Spec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The formal specs are documentation that cannot drift only if something
      # re-runs them. fslc is the FSL verifier: https://github.com/ymm-oss/fsl
      - name: Install fslc
        run: |
          curl -fsSL https://raw.githubusercontent.com/ymm-oss/fsl/main/install.sh | bash -s -- --no-skill
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Most specs must be proved; two must stay violated, since they hold the
      # counterexamples for designs that are unsound. verify.sh holds the
      # lists, and fails when a spec is in neither, so the count does not need
      # restating here every time one is added.
      - name: Verify the specs
        run: ./spec/verify.sh

  dogfood:
    name: Dogfood
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      # declscope shrink goes first, since its fix is the one that feeds the
      # analyzer: a declaration it unexports becomes private to its namespace,
      # and a boundary crossing only the analyzer then reports. Fixing in this
      # order converges in one pass each, so CI checks in the same order.
      # Silence is the assertion here too: nothing exported inside internal/
      # goes unused outside its package without an ignore that says why.
      - name: Run declscope shrink on itself
        run: go run ./cmd/declscope shrink

      # declscope is subject to its own rules, at the strictest setting.
      # Silence is the assertion: every namespace crossing inside the tool is
      # stated in the source, so anything printed here is one nobody wrote down.
      - name: Run declscope on itself
        run: go run ./cmd/declscope -config .declscope-strict.yaml ./...

      # Regenerating the baseline on a clean tree must produce no baseline at
      # all: declscope has no recorded violations of its own.
      - name: Check the baseline stays empty
        run: |
          go run ./cmd/declscope baseline -config .declscope-strict.yaml -o /tmp/baseline.yaml ./...
          if grep -qE '^\s{4}' /tmp/baseline.yaml; then
            echo "declscope now has recorded violations of its own:"
            cat /tmp/baseline.yaml
            exit 1
          fi
