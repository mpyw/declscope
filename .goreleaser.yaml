# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: declscope

# No `go mod tidy` hook: the binary must be built from the tree the tag names.
# CI and test_all.sh fail on an untidy go.mod or go.sum instead.

builds:
  # Pure Go analysis binary — no CGO, so every platform cross-compiles.
  - id: declscope
    main: ./cmd/declscope
    binary: declscope
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      # -V=full has to answer with the release, not with x/tools' hardcoded
      # "devel": it is the flag a reader runs to check which declscope they
      # have, and the go command reads the same line to identify the vettool.
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: mpyw
    name: declscope
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
