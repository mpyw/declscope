version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    # A method whose body never names its receiver is a function wearing a
    # method's clothes. declscope exempts methods from the naming rules, on the
    # grounds that a method is never read bare, so writing a helper as a
    # receiver-ignoring method is a way to take that exemption without earning
    # it. This catches the shape; declscope has no business knowing about it.
    - revive
  settings:
    revive:
      # Only this rule. Naming an explicit list turns revive's defaults off,
      # which is wanted: the rest overlaps what standard already reports.
      rules:
        - name: unused-receiver
    
    cyclop:
      max-complexity: 30
    funlen:
      lines: 200
      statements: 100
    gocognit:
      min-complexity: 60
    exhaustive:
      default-signifies-exhaustive: true

formatters:
  enable:
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/mpyw/declscope)
      custom-order: true
